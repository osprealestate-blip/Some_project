# Production stack for one small VPS. Run from this folder: docker compose up -d --build
# Routing is optional: add `--profile routing` after running scripts/prepare-routing.sh.
name: dpi
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: dpi
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      POSTGRES_DB: dpi
    # Sized for 4 GB. On a bigger plan raise shared_buffers to ~25% of RAM and effective_cache_size to ~50%.
    command: >
      postgres -c shared_buffers=512MB -c effective_cache_size=1536MB -c work_mem=8MB
      -c maintenance_work_mem=128MB -c max_connections=40
    ports:
      - "127.0.0.1:5432:5432"   # server-local only; reach it from your PC through an SSH tunnel
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro   # applied once, on the first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpi -d dpi"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1536m

  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_SITE_URL: https://${SITE_HOST:?set SITE_HOST in deploy/.env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Also needed at run time: pages and sitemap.xml read it per request (the build arg only reaches pages built statically).
      NEXT_PUBLIC_SITE_URL: https://${SITE_HOST}
      # Read-only login (created by scripts/create-web-role.sh). No TLS inside the private Docker network.
      DATABASE_URL: postgresql://dpi_web:${WEB_DB_PASSWORD:?set WEB_DB_PASSWORD in deploy/.env}@db:5432/dpi?sslmode=disable
      DB_CACHE_SECONDS: ${DB_CACHE_SECONDS:-300}
      ROUTING_ENABLED: ${ROUTING_ENABLED:-0}
      ROUTING_FOOT_URL: https://${SITE_HOST}/routed-foot
      ROUTING_CAR_URL: https://${SITE_HOST}/routed-car
    mem_limit: 1g

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_HOST: ${SITE_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  osrm-foot:
    profiles: ["routing"]
    image: osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 50 /data/foot/dubai.osrm
    volumes:
      - ../routing-data:/data:ro
    mem_limit: 512m

  osrm-car:
    profiles: ["routing"]
    image: osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 50 /data/car/dubai.osrm
    volumes:
      - ../routing-data:/data:ro
    mem_limit: 512m

volumes:
  dbdata:
  caddy_data:
  caddy_config:
